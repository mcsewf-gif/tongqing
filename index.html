<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通勤时间记录</title>
  <!-- PWA Web App Manifest 配置 -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22通勤记录%22,%22short_name%22:%22通勤%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f4f4f9%22,%22theme_color%22:%22%234a90e2%22}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- 引入 SheetJS 用于导出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- 引入 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f4f9; padding: 15px; margin: 0; color: #333; }
    h2 { text-align: center; margin-top: 10px; margin-bottom: 20px; color: #2c3e50; }
    
    .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
    label { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #555; }
    input, select, textarea { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; outline: none; transition: background-color 0.3s; }
    
    .route-select-group { display: flex; gap: 8px; align-items: center; }
    .route-select-group select { flex: 1; }
    .btn-add-route { background-color: #4a90e2; color: white; border: none; padding: 10px 14px; font-size: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-add-route:active { background-color: #357abd; }

    /* 颜色标识类 */
    .bg-yellow { background-color: #fff9c4 !important; }
    .bg-light-red { background-color: #ffcdd2 !important; }
    .bg-green { background-color: #c8e6c9 !important; }

    .weekday-display { font-size: 14px; color: #666; margin-top: 4px; font-weight: normal; }
    button.btn-submit { width: 100%; background-color: #4a90e2; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button.btn-submit:active { background-color: #357abd; }

    /* 按钮组样式 */
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
    .btn-export { background-color: #27ae60; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-export:active { background-color: #219150; }

    /* 图表容器 */
    .chart-container { position: relative; width: 100%; max-height: 260px; margin-top: 10px; }
    .stats-summary { font-size: 13px; color: #666; text-align: center; margin-bottom: 8px; }

    /* 历史记录列表 */
    .history-title { font-size: 18px; font-weight: bold; }
    .record-item { background: white; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 6px; }
    .record-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .record-details { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .route-tag { font-weight: bold; color: #4a90e2; background: #eef5fc; padding: 2px 8px; border-radius: 4px; font-size: 13px; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; }
    .record-memo { font-size: 13px; color: #666; font-style: italic; background: #f9f9f9; padding: 4px 8px; border-radius: 4px; }
    .delete-btn { color: #e74c3c; border: none; background: none; font-size: 12px; cursor: pointer; float: right; }
  </style>
</head>
<body>

  <h2>通勤时间记录</h2>

  <div class="card">
    <form id="commuteForm">
      <!-- 日期 & 自动计算星期 -->
      <div class="form-group">
        <label for="date">日期 <span id="weekdayDisplay" class="weekday-display"></span></label>
        <input type="date" id="date" required>
      </div>

      <!-- 出发时间 -->
      <div class="form-group">
        <label for="startTime">出发时间</label>
        <input type="time" id="startTime" required>
      </div>

      <!-- 到达时间 -->
      <div class="form-group">
        <label for="arrivalTime">到达时间</label>
        <input type="time" id="arrivalTime" required>
      </div>

      <!-- 路线选择与新增路线按钮 -->
      <div class="form-group">
        <label for="route">路线</label>
        <div class="route-select-group">
          <select id="route"></select>
          <button type="button" class="btn-add-route" onclick="addNewRoute()">+ 新增路线</button>
        </div>
      </div>

      <!-- 备注 -->
      <div class="form-group">
        <label for="memo">备注</label>
        <input type="text" id="memo" placeholder="可选简短备注...">
      </div>

      <button type="submit" class="btn-submit">保存记录</button>
    </form>
  </div>

  <!-- 迟到/晚到分析柱形图 -->
  <div class="card">
    <div style="font-weight: bold; font-size: 16px; margin-bottom: 5px; color: #c0392b;">⚠️ 8:05及以后到达路线统计</div>
    <div id="statsSummary" class="stats-summary">正在统计数据...</div>
    <div class="chart-container">
      <canvas id="lateRouteChart"></canvas>
    </div>
  </div>

  <!-- 历史记录与导出按钮 -->
  <div class="action-bar">
    <div class="history-title">历史记录</div>
    <button class="btn-export" onclick="exportToExcel()">📊 导出 Excel</button>
  </div>
  <div id="historyList"></div>

  <script>
    // 预设颜色池，方便为动态新增的路线分配柱状图颜色
    const chartColors = [
      { bg: 'rgba(231, 76, 60, 0.7)', border: 'rgba(231, 76, 60, 1)' },   // 红色 - Keele
      { bg: 'rgba(52, 152, 219, 0.7)', border: 'rgba(52, 152, 219, 1)' },  // 蓝色 - 400
      { bg: 'rgba(155, 89, 182, 0.7)', border: 'rgba(155, 89, 182, 1)' },  // 紫色
      { bg: 'rgba(230, 126, 34, 0.7)', border: 'rgba(230, 126, 34, 1)' },  // 橙色
      { bg: 'rgba(46, 204, 113, 0.7)', border: 'rgba(46, 204, 113, 1)' },  // 绿色
      { bg: 'rgba(241, 196, 15, 0.7)', border: 'rgba(241, 196, 15, 1)' }   // 黄色
    ];

    // 自定义 Chart.js 插件：将每次出发时间精准绘制在对应刻度的高度中心
    const barLabelsPlugin = {
      id: 'barLabelsPlugin',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        const dataset = chart.data.datasets[0];
        const timesData = dataset.startTimes || [];

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

        meta.data.forEach((bar, index) => {
          const times = timesData[index] || [];
          if (times.length === 0) return;

          const yAxis = chart.scales.y;

          times.forEach((timeStr, i) => {
            const yTop = yAxis.getPixelForValue(i + 1);
            const yBottom = yAxis.getPixelForValue(i);
            const yCenter = (yTop + yBottom) / 2;

            ctx.fillText(timeStr, bar.x, yCenter);
          });
        });

        ctx.restore();
      }
    };

    Chart.register(barLabelsPlugin);

    const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

    const dateInput = document.getElementById('date');
    const weekdayDisplay = document.getElementById('weekdayDisplay');
    const startTimeInput = document.getElementById('startTime');
    const arrivalTimeInput = document.getElementById('arrivalTime');
    const routeSelect = document.getElementById('route');
    const form = document.getElementById('commuteForm');
    const historyList = document.getElementById('historyList');
    const statsSummary = document.getElementById('statsSummary');

    let lateChart = null;

    // 初始化路线列表（支持从 localStorage 读取）
    function loadRoutes() {
      let savedRoutes = JSON.parse(localStorage.getItem('commuteRoutes') || '[]');
      if (savedRoutes.length === 0) {
        savedRoutes = ['Keele', '400'];
        localStorage.setItem('commuteRoutes', JSON.stringify(savedRoutes));
      }

      const currentSelected = routeSelect.value;
      routeSelect.innerHTML = '';
      savedRoutes.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        routeSelect.appendChild(opt);
      });

      if (currentSelected && savedRoutes.includes(currentSelected)) {
        routeSelect.value = currentSelected;
      }
    }

    // 添加新路线
    window.addNewRoute = function() {
      const newRoute = prompt("请输入新路线名称（例如：Hwy 427、Yonge等）：");
      if (!newRoute) return;
      const trimmed = newRoute.trim();
      if (!trimmed) return;

      let savedRoutes = JSON.parse(localStorage.getItem('commuteRoutes') || '["Keele", "400"]');
      if (savedRoutes.includes(trimmed)) {
        alert("该路线已存在！");
        routeSelect.value = trimmed;
        return;
      }

      savedRoutes.push(trimmed);
      localStorage.setItem('commuteRoutes', JSON.stringify(savedRoutes));
      loadRoutes();
      routeSelect.value = trimmed;
    };

    // 初始化默认当天日期
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
    updateWeekday(today);

    // 监听日期变化更新星期
    dateInput.addEventListener('change', (e) => {
      updateWeekday(e.target.value);
    });

    function updateWeekday(dateStr) {
      if (!dateStr) {
        weekdayDisplay.textContent = "";
        return;
      }
      const dateObj = new Date(dateStr + "T00:00:00");
      const dayName = weekdays[dateObj.getDay()];
      weekdayDisplay.textContent = `(${dayName})`;
    }

    // 出发时间颜色逻辑
    startTimeInput.addEventListener('input', () => {
      const val = startTimeInput.value;
      startTimeInput.classList.remove('bg-yellow', 'bg-light-red');
      if (val >= "06:55" && val <= "06:59") {
        startTimeInput.classList.add('bg-yellow');
      } else if (val >= "07:00") {
        startTimeInput.classList.add('bg-light-red');
      }
    });

    // 到达时间颜色逻辑
    arrivalTimeInput.addEventListener('input', () => {
      const val = arrivalTimeInput.value;
      arrivalTimeInput.classList.remove('bg-green', 'bg-light-red');
      if (val < "08:05") {
        arrivalTimeInput.classList.add('bg-green');
      } else if (val >= "08:05") {
        arrivalTimeInput.classList.add('bg-light-red');
      }
    });

    // 颜色类名辅助工具
    function getStartBgClass(val) {
      if (val >= "06:55" && val <= "06:59") return 'bg-yellow';
      if (val >= "07:00") return 'bg-light-red';
      return '';
    }

    function getArrivalBgClass(val) {
      if (val < "08:05") return 'bg-green';
      if (val >= "08:05") return 'bg-light-red';
      return '';
    }

    // 动态更新柱形图统计
    function updateChart(records) {
      const savedRoutes = JSON.parse(localStorage.getItem('commuteRoutes') || '["Keele", "400"]');
      
      // 初始化每条路线的数据集
      const routeCounts = {};
      const routeStartTimes = {};
      savedRoutes.forEach(r => {
        routeCounts[r] = 0;
        routeStartTimes[r] = [];
      });

      // 筛选 8:05 及以后到达记录并按时间升序
      const lateRecords = records
        .filter(r => r.arrivalTime >= "08:05")
        .sort((a, b) => new Date(a.date + 'T' + a.startTime) - new Date(b.date + 'T' + b.startTime));

      lateRecords.forEach(r => {
        if (!routeCounts.hasOwnProperty(r.route)) {
          routeCounts[r.route] = 0;
          routeStartTimes[r.route] = [];
          if (!savedRoutes.includes(r.route)) savedRoutes.push(r.route);
        }
        routeCounts[r.route]++;
        routeStartTimes[r.route].push(r.startTime);
      });

      const totalLate = lateRecords.length;
      if (totalLate === 0) {
        statsSummary.textContent = "暂无 8:05 及以后到达的记录";
      } else {
        const detailsStr = savedRoutes
          .map(r => `${r}: ${routeCounts[r]}次`)
          .join('，');
        statsSummary.textContent = `共 ${totalLate} 次晚于 8:05 到达（${detailsStr}）`;
      }

      const labels = savedRoutes;
      const dataValues = savedRoutes.map(r => routeCounts[r]);
      const startTimesValues = savedRoutes.map(r => routeStartTimes[r]);
      
      const bgColors = savedRoutes.map((_, idx) => chartColors[idx % chartColors.length].bg);
      const borderColors = savedRoutes.map((_, idx) => chartColors[idx % chartColors.length].border);

      const ctx = document.getElementById('lateRouteChart').getContext('2d');

      if (lateChart) {
        lateChart.data.labels = labels;
        lateChart.data.datasets[0].data = dataValues;
        lateChart.data.datasets[0].startTimes = startTimesValues;
        lateChart.data.datasets[0].backgroundColor = bgColors;
        lateChart.data.datasets[0].borderColor = borderColors;
        lateChart.update();
      } else {
        lateChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: '8:05及以后到达次数',
              data: dataValues,
              startTimes: startTimesValues,
              backgroundColor: bgColors,
              borderColor: borderColors,
              borderWidth: 1.5,
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { stepSize: 1, precision: 0 }
              }
            }
          }
        });
      }
    }

    // 读取本地存储并显示
    function loadRecords() {
      const records = JSON.parse(localStorage.getItem('commuteRecords') || '[]');
      historyList.innerHTML = '';
      
      // 按日期倒序排列（最近的在上面）
      records.sort((a, b) => new Date(b.date + 'T' + b.startTime) - new Date(a.date + 'T' + a.startTime));

      records.forEach((record, index) => {
        const dateObj = new Date(record.date + "T00:00:00");
        const dayName = weekdays[dateObj.getDay()];
        
        const item = document.createElement('div');
        item.className = 'record-item';
        item.innerHTML = `
          <div class="record-header">
            <span>${record.date} ${dayName}</span>
          </div>
          <div class="record-details">
            <span>出发: <span class="badge ${getStartBgClass(record.startTime)}">${record.startTime}</span></span>
            <span class="route-tag">${record.route}</span>
            <span>到达: <span class="badge ${getArrivalBgClass(record.arrivalTime)}">${record.arrivalTime}</span></span>
          </div>
          ${record.memo ? `<div class="record-memo">备注: ${record.memo}</div>` : ''}
          <div>
            <button class="delete-btn" onclick="deleteRecord(${index})">删除</button>
          </div>
        `;
        historyList.appendChild(item);
      });

      // 更新路线下拉列表及统计图表
      loadRoutes();
      updateChart(records);
    }

    // 保存提交
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newRecord = {
        date: dateInput.value,
        startTime: startTimeInput.value,
        arrivalTime: arrivalTimeInput.value,
        route: routeSelect.value,
        memo: document.getElementById('memo').value
      };

      const records = JSON.parse(localStorage.getItem('commuteRecords') || '[]');
      records.push(newRecord);
      localStorage.setItem('commuteRecords', JSON.stringify(records));

      // 重置表单输入（保留日期和路线）
      startTimeInput.value = '';
      arrivalTimeInput.value = '';
      document.getElementById('memo').value = '';
      startTimeInput.classList.remove('bg-yellow', 'bg-light-red');
      arrivalTimeInput.classList.remove('bg-green', 'bg-light-red');

      loadRecords();
    });

    // 删除记录
    window.deleteRecord = function(index) {
      let records = JSON.parse(localStorage.getItem('commuteRecords') || '[]');
      records.sort((a, b) => new Date(b.date + 'T' + b.startTime) - new Date(a.date + 'T' + a.startTime));
      records.splice(index, 1);
      localStorage.setItem('commuteRecords', JSON.stringify(records));
      loadRecords();
    }

    // 导出 Excel 功能
    window.exportToExcel = function() {
      const records = JSON.parse(localStorage.getItem('commuteRecords') || '[]');
      if (records.length === 0) {
        alert("暂无记录可导出！");
        return;
      }

      // 排序（按日期升序导出）
      records.sort((a, b) => new Date(a.date + 'T' + a.startTime) - new Date(b.date + 'T' + b.startTime));

      // 转换为 Excel 格式数组
      const excelData = records.map(r => {
        const dateObj = new Date(r.date + "T00:00:00");
        const dayName = weekdays[dateObj.getDay()];
        return {
          "日期": r.date,
          "星期": dayName,
          "出发时间": r.startTime,
          "路线": r.route,
          "到达时间": r.arrivalTime,
          "是否8:05及以后到达": r.arrivalTime >= "08:05" ? "是" : "否",
          "备注": r.memo || ""
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "通勤记录");

      // 触发下载
      XLSX.writeFile(workbook, `通勤时间记录_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    // 注册简单的 Service Worker (支持 PWA 离线运行)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }

    // 页面加载完成后加载数据
    loadRecords();
  </script>
</body>
</html>
